<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>今日午餐菜單｜校園午餐查詢</title>
    <!-- 引入 Google Fonts: Noto Serif TC (明體/宋體) 營造濃厚日式和風感 -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600;700;900&display=swap" rel="stylesheet">
    
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- 引入 Vue 3 與 Axios -->
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        washi: '#F9F6F0',      // 和紙淺米色
                        washiDark: '#EFECE6',  // 深和紙色
                        sumi: '#2B2B2B',       // 墨色
                        indigoJp: '#1E3A5F',   // 藍染 / 紺色
                        enji: '#B83B2A',       // 茜色 / 印章朱紅
                        matcha: '#5C7457',     // 抹茶綠
                        hinoki: '#C8A97E',     // 檜木色
                        goldJp: '#C5A059',     // 金箔色
                    },
                    fontFamily: {
                        serif: ['"Noto Serif TC"', 'serif'],
                    }
                }
            }
        }
    </script>

    <style>
        body {
            font-family: 'Noto Serif TC', serif;
            background-color: #FFFFFF;
            color: #2B2B2B;
            margin: 0;
            padding: 0;
        }

        /* 固定高度 300px 專用容器 */
        .widget-300 {
            height: 300px;
            max-height: 300px;
            box-sizing: border-box;
        }

        /* 日式木牌陰影與邊框（純白底緊湊版） */
        .kondate-card {
            background-color: #FFFFFF;
            box-shadow: 0 4px 14px -4px rgba(43, 43, 43, 0.08), 0 0 1px 1px rgba(139, 109, 76, 0.25);
            position: relative;
        }

        /* 內部雙層傳統細框 */
        .kondate-inner-border {
            border: 1px solid #D5C7B2;
            position: relative;
        }
        .kondate-inner-border::before {
            content: '';
            position: absolute;
            top: 2px; left: 2px; right: 2px; bottom: 2px;
            border: 1px solid #E6DEC8;
            pointer-events: none;
        }

        /* 印章 (Hanko) 迷你樣式 */
        .hanko-stamp {
            border: 1.5px solid #B83B2A;
            color: #B83B2A;
            font-weight: 900;
            line-height: 1.05;
            box-shadow: inset 0 0 0 1px rgba(184, 59, 42, 0.15);
            transform: rotate(-6deg);
        }

        /* 自訂下拉選單箭頭 (縮小版) */
        select.jp-select {
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%238B6D4C' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 0.45rem center;
            background-size: 0.85em;
        }

        /* 細緻捲軸（當菜色超過 6 道時可微幅滑動而不破版） */
        .thin-scroll::-webkit-scrollbar {
            width: 4px;
        }
        .thin-scroll::-webkit-scrollbar-track {
            background: #F9F6F0;
        }
        .thin-scroll::-webkit-scrollbar-thumb {
            background: #D5C7B2;
            border-radius: 2px;
        }

        /* 淡入動畫 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(3px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .animate-fade-in {
            animation: fadeIn 0.3s ease-out forwards;
        }
    </style>
</head>
<body class="bg-white overflow-hidden">

    <div id="lunchApp" class="w-full max-w-xl mx-auto widget-300 flex flex-col p-1.5 select-none">
        
        <!-- 頂部木質橫樑裝飾 (濃縮為 6px) -->
        <div class="h-1.5 bg-gradient-to-r from-[#6E5236] via-[#8B6D4C] to-[#6E5236] rounded-t shrink-0"></div>

        <!-- 主菜單卡片 (撐滿剩餘高度) -->
        <div class="kondate-card rounded-b flex-1 flex flex-col p-1.5 overflow-hidden">
            <div class="kondate-inner-border flex-1 flex flex-col justify-between px-3 py-2 rounded-sm overflow-hidden relative">
                
                <!-- 四角傳統裝飾紋 (縮小版) -->
                <div class="absolute top-1 left-1 w-2 h-2 border-t border-l border-[#8B6D4C] pointer-events-none"></div>
                <div class="absolute top-1 right-1 w-2 h-2 border-t border-r border-[#8B6D4C] pointer-events-none"></div>
                <div class="absolute bottom-1 left-1 w-2 h-2 border-b border-l border-[#8B6D4C] pointer-events-none"></div>
                <div class="absolute bottom-1 right-1 w-2 h-2 border-b border-r border-[#8B6D4C] pointer-events-none"></div>

                <!-- 頂部標題與日期控制列 (濃縮於單一橫列) -->
                <header class="flex items-center justify-between border-b border-stone-200 pb-1.5 shrink-0 gap-2">
                    <div class="flex items-center gap-2.5 min-w-0">
                        <!-- 落款朱印 (放大圖章與字體) -->
                        <div class="hanko-stamp w-9 h-9 rounded-sm flex flex-col items-center justify-center text-[11px] tracking-tighter shrink-0">
                            <span>嚴選</span>
                            <span>食材</span>
                        </div>
                        <div class="truncate">
                            <div class="flex items-center gap-2">
                                <h1 class="text-lg sm:text-xl font-bold tracking-widest text-sumi leading-tight truncate">
                                    午餐菜單
                                </h1>
                                <span class="px-1.5 py-0.5 text-xs tracking-wider bg-indigoJp text-white rounded-sm shrink-0">
                                    {{ schoolId }}
                                </span>
                            </div>
                          
                        </div>
                    </div>

                    <!-- 右側：日期切換 -->
                    <div class="flex items-center gap-1 shrink-0">
                        <input 
                            type="date" 
                            v-model="selectedDate" 
                            @change="fetchMealInfo"
                            class="text-xs sm:text-sm bg-stone-50 border border-stone-300 rounded px-2 py-1 text-stone-700 focus:outline-none focus:border-indigoJp transition cursor-pointer"
                            title="切換查詢日期"
                        />
                    </div>
                </header>

                <!-- 中間主要內容區 (彈性高度，固定於 300px 內) -->
                <main class="flex-1 flex flex-col justify-center overflow-hidden my-1">
                    
                    <!-- 讀取中狀態 -->
                    <div v-if="loading" class="flex flex-col items-center justify-center space-y-2">
                        <div class="relative w-8 h-8 flex items-center justify-center">
                            <div class="absolute inset-0 rounded-full border-2 border-stone-200 border-t-enji animate-spin"></div>
                            <span class="text-xs text-stone-500">餐</span>
                        </div>
                        <p class="text-sm text-stone-500 tracking-widest animate-pulse">正在載入菜單...</p>
                    </div>

                    <!-- 有供餐資料時顯示 -->
                    <div v-else-if="info.data && info.data.length > 0" class="flex-1 flex flex-col justify-between overflow-hidden animate-fade-in">
                        
                        <!-- 廚房 / 供餐單位選擇器 (字體放大) -->
                        <div class="bg-stone-50 px-2.5 py-1 rounded border border-stone-200/80 flex items-center justify-between gap-2 shrink-0 mb-1.5">
                            <label for="KitchenName" class="text-sm font-bold text-stone-700 tracking-wider flex items-center gap-1.5 shrink-0">
                                <span class="w-1 h-3.5 bg-indigoJp rounded-sm inline-block"></span>
                                午餐供餐：
                            </label>
                            <select 
                                id="KitchenName" 
                                v-model="selectedBatchdataId"
                                class="jp-select flex-1 max-w-[280px] bg-white border border-stone-300 text-sumi text-sm font-medium rounded px-2.5 py-0.5 pr-6 focus:outline-none focus:border-indigoJp transition cursor-pointer truncate"
                            >
                                <option v-if="info.data.length > 1" value="000000" disabled>── 請選擇供餐廚房 ──</option>
                                <option v-for="option in info.data" :key="option.BatchDataId" :value="option.BatchDataId">
                                    {{ option.KitchenName }}
                                </option>
                            </select>
                        </div>

                        <!-- 菜色讀取中 -->
                        <div v-if="menuLoading" class="flex-1 flex items-center justify-center text-sm text-stone-500 tracking-widest">
                            正在讀取菜色資料...
                        </div>

                        <!-- 顯示菜單列表 (雙欄網格，菜色字體放大) -->
                        <div v-else-if="menu.data && menu.data.length > 0" class="flex-1 overflow-y-auto thin-scroll pr-0.5">
                            <div class="grid grid-cols-1 sm:grid-cols-2 gap-x-3 gap-y-1">
                                <div 
                                    v-for="(dish, index) in menu.data" 
                                    :key="index"
                                    class="group flex items-center justify-between py-1 px-2 rounded-sm bg-white hover:bg-stone-50 border-b border-dashed border-stone-200 hover:border-hinoki transition-colors"
                                >
                                    <div class="flex items-center space-x-2 min-w-0">
                                        <!-- 菜色類別標籤 -->
                                        <span 
                                            v-if="dish.DishType !== undefined && dish.DishType !== ''" 
                                            :class="getDishTypeBadgeClass(dish.DishType)"
                                            class="text-xs px-1.5 py-0.5 rounded-sm font-medium tracking-wider shrink-0 leading-tight"
                                        >
                                            {{ dish.DishType }}
                                        </span>
                                        <span 
                                            v-else 
                                            class="text-xs px-1.5 py-0.5 rounded-sm font-medium tracking-wider bg-stone-200 text-stone-700 shrink-0 leading-tight"
                                        >
                                            供餐廠商
                                        </span>

                                        <!-- 菜色名稱 -->
                                        <span class="text-sm sm:text-base font-bold text-sumi group-hover:text-indigoJp transition-colors truncate">
                                            {{ dish.DishName }}
                                        </span>
                                    </div>

                                    <!-- 右側日式小紋點綴 -->
                                    <span class="text-stone-300 group-hover:text-enji transition-colors text-xs shrink-0 ml-1">
                                        ❀
                                    </span>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- 本日無菜單狀態 (放大字體與圖示) -->
                    <div v-else class="flex-1 flex flex-col items-center justify-center text-center px-2 animate-fade-in">
                        <div class="flex items-center justify-center gap-3">
                            <!-- 日式茶碗插畫 SVG -->
                            <div class="w-11 h-11 text-stone-400 flex items-center justify-center rounded-full bg-stone-50 border border-stone-200 shrink-0">
                                <svg class="w-6 h-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M8 3c0 1.5-1.5 2-1.5 3.5S8 8.5 8 10M12 2c0 1.5-1.5 2-1.5 3.5S12 7.5 12 9M16 3c0 1.5-1.5 2-1.5 3.5S16 8.5 16 10" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 12h16c0 5-3.5 8-8 8s-8-3-8-8z" />
                                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 20h6v1.5H9V20z" />
                                </svg>
                            </div>
                            <div class="text-left">
                                <div class="inline-block border-b-2 border-enji/60 pb-0.5">
                                    <span class="text-base sm:text-lg font-bold tracking-[0.2em] text-sumi">本日無菜單</span>
                                </div>
                                <p class="text-xs sm:text-sm text-stone-500 tracking-wide mt-1">
                                    所選日期（{{ selectedDate }}）尚無供餐紀錄或適逢假日。
                                </p>
                            </div>
                        </div>
                    </div>
                </main>

                <!-- 底部資訊列 -->
                <footer class="pt-1.5 border-t border-stone-200/80 flex items-center justify-between gap-2 shrink-0">
                    <span class="text-xs text-stone-500 tracking-wider truncate">
                        ※ 教育部校園食材登錄平臺介接 · 實際菜色依當日供應為準
                    </span>
                </footer>

            </div>
        </div>
    </div>

    <script>
        const { createApp } = Vue;

        createApp({
            data() {
                // 取得今日日期字串 (YYYY-MM-DD)
                const today = new Date();
                const yyyy = today.getFullYear();
                const mm = String(today.getMonth() + 1).padStart(2, '0');
                const dd = String(today.getDate()).padStart(2, '0');

                return {
                    schoolId: "193661",
                    selectedDate: `${yyyy}-${mm}-${dd}`,
                    info: {
                        data: []
                    },
                    menu: {
                        data: []
                    },
                    selectedBatchdataId: '',
                    loading: true,
                    menuLoading: false
                };
            },
            computed: {
                // 將日期轉換為繁體中文格式（附帶星期幾）
                formattedChineseDate() {
                    if (!this.selectedDate) return '';
                    const parts = this.selectedDate.split('-');
                    if (parts.length !== 3) return this.selectedDate;
                    
                    const dateObj = new Date(Number(parts[0]), Number(parts[1]) - 1, Number(parts[2]));
                    const weekList = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
                    const weekDay = weekList[dateObj.getDay()];
                    
                    return `${parts[0]}年${Number(parts[1])}月${Number(parts[2])}日（${weekDay}）`;
                }
            },
            watch: {
                // 當使用者切換下拉選單的廚房 (selectedBatchdataId) 時，自動取得對應菜單
                selectedBatchdataId(newVal) {
                    if (newVal && newVal !== "000000") {
                        this.getMenu();
                    }
                }
            },
            created() {
                this.fetchMealInfo();
            },
            methods: {
                // 取得當日供餐廚房清單
                fetchMealInfo() {
                    this.loading = true;
                    this.info = { data: [] };
                    this.menu = { data: [] };
                    this.selectedBatchdataId = '';

                    // 將日期轉為 API 支援的格式 (例如 2026-10-18)
                    const parts = this.selectedDate.split('-');
                    const period = `${Number(parts[0])}-${Number(parts[1])}-${Number(parts[2])}`;
                    
                    // 修正原檔尾端多餘的雙引號，確保查詢格式乾淨正確
                    const url = `https://fatraceschool.k12ea.gov.tw/offered/meal?KitchenId=all&MenuType=1&period=${period}&SchoolId=${this.schoolId}`;

                    axios.get(url)
                        .then(response => {
                            this.info = response.data || { data: [] };
                            
                            if (this.info.data && this.info.data.length === 1) {
                                // 若只有一間廚房，直接選取並載入其菜色
                                this.selectedBatchdataId = this.info.data[0].BatchDataId;
                            } else if (this.info.data && this.info.data.length > 1) {
                                // 若有多間廚房，保留原程式邏輯：預設顯示各廚房名稱列表，亦可直接從下拉選單切換
                                this.selectedBatchdataId = "000000";
                                this.menu.data = [];
                                this.info.data.forEach(item => {
                                    this.menu.data.push({
                                        DishName: item.KitchenName
                                    });
                                });
                            }
                        })
                        .catch(error => {
                            console.error("查詢供餐資訊失敗:", error);
                            this.info = { data: [] };
                        })
                        .finally(() => {
                            this.loading = false;
                        });
                },

                // 依據 BatchDataId 查詢菜色明細
                getMenu() {
                    if (this.selectedBatchdataId !== "000000" && this.selectedBatchdataId !== "") {
                        this.menuLoading = true;
                        const url = `https://fatraceschool.k12ea.gov.tw/dish?BatchDataId=${this.selectedBatchdataId}`;
                        axios.get(url)
                            .then(response => {
                                this.menu = response.data || { data: [] };
                            })
                            .catch(error => {
                                console.error("查詢菜單明細失敗:", error);
                            })
                            .finally(() => {
                                this.menuLoading = false;
                            });
                    }
                },

                // 查看詳細資料 (開啟教育部校園食材登錄平臺)
                queryDetail() {
                    const url = `https://fatraceschool.k12ea.gov.tw/frontend/search.html?school=${this.schoolId}/`;
                    window.open(url, '_blank');
                },

                // 依照菜色類別給予不同的日式傳統色票標籤
                getDishTypeBadgeClass(type) {
                    if (!type) return 'bg-stone-600 text-washi';
                    if (type.includes('主食')) return 'bg-indigoJp text-washi';      // 藍染紺色
                    if (type.includes('主菜')) return 'bg-enji text-washi';          // 茜色朱紅
                    if (type.includes('副菜') || type.includes('蔬菜') || type.includes('青菜')) return 'bg-matcha text-washi'; // 抹茶色
                    if (type.includes('湯')) return 'bg-[#8B6D4C] text-washi';       // 琥珀木色
                    if (type.includes('水果') || type.includes('點心') || type.includes('乳品')) return 'bg-[#B57C3E] text-washi'; // 金茶色
                    return 'bg-stone-700 text-washi';
                }
            }
        }).mount('#lunchApp');
    </script>
</body>
</html>
